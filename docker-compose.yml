services:
  vllm:
    container_name: vllm
    image: docker.io/vllm/vllm-openai:nightly
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_ALLOC_CONF: expandable_segments:True
      VLLM_LOGGING_LEVEL: INFO
    volumes:
      - /ssd/public/internet/huggingface.co:/huggingface.co:ro
      - /home/nixos/data-vllm:/root/.cache/vllm
    shm_size: 16g
    ports:
      - "8000:8000"
    command: >
      /huggingface.co/Qwen/Qwen3.8-27B-FP8
      --served-model-name Qwen3.8-27B-FP8
      --host 0.0.0.0
      --port 8000
      --max-model-len 262144
      --gpu-memory-utilization 0.90
      --kv-cache-dtype fp8
      --max-num-seqs 16
      --max-num-batched-tokens 8192
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --enable-request-id-headers
      --enable-log-requests
      --enable-per-request-metrics
      --enable-prompt-tokens-details
      --enable-force-include-usage
      --enable-server-load-tracking
      --kv-cache-metrics
      --kv-cache-metrics-sample 0.01
      --enable-prefix-caching
      --performance-mode interactivity

  vllm-omni:
    container_name: vllm-omni
    image: vllm/vllm-omni:minimax-h3
    profiles: ["omni"]
    ports:
      - "8100:8000"
    devices:
      - nvidia.com/gpu=0
    shm_size: "16g"
    environment:
      PYTHONPATH: /vllm-omni
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "14400"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /hdd/public/internet/huggingface-temp/MiniMaxAI/MiniMax-H3:/MiniMax-H3:ro
      - /home/nixos/vllm-omni-src:/vllm-omni:ro
      - /home/nixos/minimax-h3-output:/output
    command: >
      vllm serve /MiniMax-H3
      --omni
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --num-gpus 1
      --enable-cpu-offload
      --diffusion-attention-backend CUDNN_ATTN
      --init-timeout 3600

  forgejo:
    container_name: forgejo
    image: codeberg.org/forgejo/forgejo:16
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /home/nixos/data-forgejo:/data

  hermes:
    container_name: hermes
    image: docker.io/nousresearch/hermes-agent
    restart: unless-stopped
    userns_mode: "keep-id:uid=10000,gid=10000"
    user: "0:0"
    volumes:
      - /home/nixos/tigor-ai/.hermes:/opt/data
      - /home/nixos:/home/nixos
    ports:
      - "9119:9119"
    environment:
      HERMES_DASHBOARD: "1"
    command: ["gateway", "run"]

  0-dash:
    container_name: 0-dash
    build: ./infra/0-dash
    restart: unless-stopped
    ports:
      - "1337:1337"
    volumes:
      - /hdd/public/internet:/hdd/public/internet:ro
      - /ssd/public/internet:/ssd/public/internet:ro
      - /home/nixos/tigor-ai:/home/nixos/tigor-ai:ro
      - /home/nixos/tigor-ai.worktrees:/home/nixos/tigor-ai.worktrees:ro
      - /home/nixos/tigor-no-ai:/home/nixos/tigor-no-ai:ro
      - /home/nixos/tigor-no-ai.worktrees:/home/nixos/tigor-no-ai.worktrees:ro
      - /home/nixos/tigor-no-ai.pr29:/home/nixos/tigor-no-ai.pr29:ro

  caddy:
    container_name: caddy
    image: docker.io/library/caddy:2
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      - ACME_AGREE=true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /home/nixos/tigor-ai.worktrees/public-http-pages:/srv/data:ro
      - /home/nixos/data-caddy/data:/data
      - /home/nixos/data-caddy/config:/config
    ports:
      - "80:80"
      - "443:443" 

