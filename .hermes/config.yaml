model:
  default: Qwen3.8-27B-FP8
  provider: custom:local
  max_compressions: 10
model_aliases:
  local:
    model: Qwen3.8-27B-FP8
    provider: custom:local
  glm:
    model: z-ai/glm-5.3
    provider: custom:glm
  kimi:
    model: moonshotai/kimi-k3
    provider: custom:kimi
  qwen:
    model: qwen/qwen3.8-27b
    provider: custom:qwen
agent:
  max_turns: 150
  verbose: true
  reasoning_effort: medium
  ask: false
terminal:
  backend: ssh
  cwd: .
  timeout: 60
  ssh_host: host.containers.internal
  ssh_user: nixos
  ssh_port: 22
  ssh_key: /home/nixos/.ssh/id_ed25519
  lifetime_seconds: 300
web:
  backend: ddgs
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: local
  use_gateway: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.4
  target_ratio: 0.15
  protect_last_n: 20
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: steer
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: none
  streaming: true
  file_mutation_verifier: false
  skin: default
  interim_assistant_messages: true
  platforms:
    telegram:
      tool_progress: brief
      interim_assistant_messages: true
  tool_progress: brief
  long_running_notifications: false
  busy_ack_detail: false
dashboard:
  basic_auth:
    username: admin
    password_hash: scrypt$16384$8$1$yMHzyGGnubPc1uuJZTmuPw=$DB8ixU/JzGu0rri/kGTbLiZj7sneZH3ivshxIn7Rt9s=
tts:
  use_gateway: false
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 250
skills:
  creation_nudge_interval: 15
command_allowlist:
  - script execution via heredoc
security:
  redact_secrets: false
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 38
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  telegram:
    - browser
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
context_compression:
  threshold: 40
  target_ratio: 0.15
custom_providers:
  - name: local
    base_url: http://vllm:8000/v1
    model: Qwen3.8-27B-FP8
    models:
      Qwen3.8-27B-FP8:
