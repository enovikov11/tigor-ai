# jev-chess.tgr.rs — single Caddy gateway for BOTH prod and staging domains.
#   prod:    https://jev-chess.tgr.rs        -> this caddy -> jevnet   172.30.42.10:8443
#   staging: https://jev-chess-staging.tgr.rs -> this caddy -> jev-shared 172.30.43.10:8443
# Client IP trust model: each proxy trusts X-Real-IP only from its own
# gateway subnet (set by Caddy from {remote_host}, overwriting any
# client-supplied value). Proxies are unreachable from outside their networks.
services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jev-chess-proxy
    env_file:
      - .env
    environment:
      PORT: "8443"
      GATEWAY_SUBNET: 172.30.42.0/24
    networks:
      jevnet:
        ipv4_address: 172.30.42.10
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8443/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/jev-chess:ro
      - ./staging/web:/srv/jev-chess-staging:ro
      - caddy_config:/config
      - caddy_data:/data
    depends_on:
      - proxy
    networks:
      - jevnet
      - jev-shared

networks:
  jevnet:
    ipam:
      config:
        - subnet: 172.30.42.0/24
  jev-shared:
    external: true

volumes:
  caddy_config:
  caddy_data:
