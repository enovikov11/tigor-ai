<!doctype html>
<html><head><meta charset="utf-8"><title>sizes</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:2rem}
table{border-collapse:collapse;width:100%}
td,th{padding:.35em .8em;border-bottom:1px solid #333}
.num{text-align:right}
.ic{white-space:nowrap}
tr:hover{background:#1e1e1e}
.legend{color:#999}
.bar{background:#333;border-radius:3px;height:.9em;overflow:hidden;display:inline-block;width:20em;vertical-align:middle}
.bar i{display:block;height:100%;background:#4a4}
.btn{cursor:pointer;background:#222;color:#8f8;border:none;border-radius:3px;font-family:inherit;padding:0 .5em;margin-right:.5em}
.btn.r{float:right;margin-left:.5em;margin-right:0}
.warn{color:#f55;font-size:1.2em}
@keyframes spin{to{transform:rotate(360deg)}}
#loading{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:10;color:#768390;font-family:monospace}
#loading .spin{width:34px;height:34px;border:3px solid #21262d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite}
#loading[hidden]{display:none}
</style></head><body>
<h1>model sizes</h1>
<p class="legend">&#183; &#9889; = ssd &#183; &#128034; = hdd &#183; &#128032; = 100 GB &#183; &#128021; = 10 GB (max of ssd/hdd, round up) &#183; &#129482; = quant &#183; &#10067; = file size differs between ssd/hdd &#183; &#8852; = split &#183; &#10513; = copy full path(s)</p>
<div id="disks"></div>
<div id="loading"><div class="spin"></div><div>scanning disks&#8230;</div></div>
<div id="tbl"></div>
<script>
let rows = [];
const openP = new Set(), openM = new Set();
const GB = 1073741824;
const DISK = {ssd: '\u26A1', hdd: '\uD83D\uDC22'}, Q = '\uD83E\uDDCA', WARN = '\u2757';
function icons(gb){ if(gb<=0) return ''; const b=Math.ceil(gb/10); return '\uD83D\uDC18'.repeat(Math.floor(b/10))+'\uD83D\uDC2D'.repeat(b%10); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function copy(el){
  const p = decodeURIComponent(el.dataset.p);
  const done = () => { el.textContent='\u2713'; setTimeout(()=>el.textContent='\u29C9',1000); };
  const fb = () => { const t=document.createElement('textarea'); t.value=p; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(p).then(done).catch(fb); } else { fb(); }
}
function toggle(el){
  const k = decodeURIComponent(el.dataset.p);
  const set = el.dataset.k === 'p' ? openP : openM;
  if(set.has(k)) set.delete(k); else set.add(k);
  build();
}
function build(){
  const out = [];
  for(const r of rows){
    if(r.level === 0){
      if(!openP.has(r.key)) out.push(r);
    } else if(r.level === 1){
      if(openP.has(r.parent) && !openM.has(r.key)) out.push(r);
    } else {
      if(openM.has(r.parent)) out.push(r);
    }
  }
  out.sort((a,b) => Math.max(b.ssd,b.hdd) - Math.max(a.ssd,a.hdd));
  const html = out.map(r =>
    '<tr><td>' +
    (r.canSplit ? '<button class="btn" data-k="' + (r.level===0?'p':'m') + '" data-p="' + encodeURIComponent(r.key) + '" onclick="toggle(this)">\u229E</button>' : '') +
    '<span>' + esc(r.name) + (r.hasQ ? ' ' + Q : '') + '</span>' +
    '<button class="btn r" data-p="' + encodeURIComponent(r.paths.join('\n')) + '" onclick="copy(this)">\u29C9</button></td>' +
    '<td class="num">' + (r.ssd ? (r.ssd/GB).toFixed(1) : '\u2014') + '</td>' +
    '<td class="num">' + (r.hdd ? (r.hdd/GB).toFixed(1) : '\u2014') + '</td>' +
    '<td class="ic">' + icons(Math.max(r.ssd,r.hdd)/GB) + (r.mm ? ' <span class="warn">' + WARN + '</span>' : '') + '</td></tr>'
  ).join('');
  document.getElementById('tbl').innerHTML =
    '<table><thead><tr><th>path</th><th class="num">\u26A1 ssd GB</th><th class="num">\uD83D\uDC22 hdd GB</th><th>size (max)</th></tr></thead><tbody>' +
    html + '</tbody></table>';
  document.getElementById('loading').hidden = true;
}
fetch('/api/disks').then(r=>r.json()).then(dk=>{
  document.getElementById('disks').innerHTML = dk.disks.map(d=>{
    const pct = Math.round(d.used_gb/d.total_gb*100);
    return '<p>' + DISK[d.disk] + ' ' + d.mount + ': ' + d.used_gb + ' / ' + d.total_gb + ' GB (' + pct + '%)' +
      ' <span class="bar"><i style="width:' + pct + '%"></i></span></p>';
  }).join('');
}).catch(e=>{ const l=document.getElementById('loading'); l.innerHTML='<div style="color:#f55">disk info error: ' + esc(String(e)) + '</div>'; });
fetch('/api/sizes').then(r=>r.json()).then(sz=>{
  rows = sz.entries;
  build();
}).catch(e=>{ const l=document.getElementById('loading'); l.innerHTML='<div style="color:#f55">scan error: ' + esc(String(e)) + '</div>'; });
</script>
</body></html>
