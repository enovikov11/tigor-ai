<!doctype html>
<html><head><meta charset="utf-8"><title>sizes</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:2rem}
table{border-collapse:collapse;width:100%}
td,th{padding:.35em .8em;border-bottom:1px solid #333}
.num{text-align:right}
.ic{white-space:nowrap}
tr:hover{background:#1e1e1e}
.legend{color:#999}
.bar{background:#333;border-radius:3px;height:.9em;overflow:hidden;display:inline-block;width:20em;vertical-align:middle}
.bar i{display:block;height:100%;background:#4a4}
.btn{cursor:pointer;background:#222;color:#8f8;border:none;border-radius:3px;font-family:inherit;padding:0 .5em;margin-right:.5em}
.btn.r{float:right;margin-left:.5em;margin-right:0}
.warn{color:#f55;font-size:1.2em}
.disc{color:#fa0;font-size:1.1em}
.rep...5em;font-size:.9em}
.lvl{color:#999;margin:.5em 0}
.lvl label{margin-right:1.2em;cursor:pointer}
.lvl input{vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
#loading{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:10;color:#768390;font-family:monospace}
#loading .spin{width:34px;height:34px;border:3px solid #21262d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite}
#loading[hidden]{display:none}
</style></head><body>
<h1>model sizes</h1>
<p class="legend">&#183; &#9889; = ssd &#183; &#128034; = hdd &#183; &#128032; = 100 GB &#183; &#128021; = 10 GB (max of ssd/hdd, round up) &#183; &#129482; = quant &#183; &#10067; = file size differs between ssd/hdd &#183; &#9888; = file(s) present on one disk only &#183; &#8852; = expand &#183; &#10513; = copy full path(s)</p>
<div id="disks"></div>
<div class="lvl">detail:
<label><input type="radio" name="lvl" value="0" checked onchange="setLevel(0)"> provider</label>
<label><input type="radio" name="lvl" value="1" onchange="setLevel(1)"> provider/model</label>
<label><input type="radio" name="lvl" value="2" onchange="setLevel(2)"> provider/model/quant</label>
</div>
<div id="loading"><div class="spin"></div><div>scanning disks&#8230;</div></div>
<div id="tbl"></div>
<h2>repos</h2>
<div id="repos"></div>
<script>
let rows = [];
let level = 0;
const openP = new Set(), openM = new Set();
const GB = 1073741824;
const DISK = {ssd: '\u26A1', hdd: '\uD83D\uDC22'}, Q = '\uD83E\uDDCA', WARN = '\u2757', DISC = '\u26A0';
function icons(gb){ if(gb<=0) return ''; const b=Math.ceil(gb/10); return '\uD83D\uDC18'.repeat(Math.floor(b/10))+'\uD83D\uDC2D'.repeat(b%10); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setLevel(v){ level = v; build(); }
function copy(el){
  const p = decodeURIComponent(el.dataset.p);
  const done = () => { el.textContent='\u2713'; setTimeout(()=>el.textContent='\u29C9',1000); };
  const fb = () => { const t=document.createElement('textarea'); t.value=p; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(p).then(done).catch(fb); } else { fb(); }
}
function toggle(el){
  const k = decodeURIComponent(el.dataset.p);
  const set = el.dataset.k === 'p' ? openP : openM;
  if(set.has(k)) set.delete(k); else set.add(k);
  build();
}
function build(){
  const kids1 = {}, kids2 = {}, p1 = {}, p0 = {};
  for(const r of rows){
    if(r.level === 1){
      if(r.p0) (kids1[r.p0] = kids1[r.p0] || []).push(r);
    } else if(r.level === 2){
      if(r.p1) (kids2[r.p1] = kids2[r.p1] || []).push(r);
      if(r.p1) (p1[r.p1] = p1[r.p1] || []).push(r.paths);
      if(r.p0) (p0[r.p0] = p0[r.p0] || []).push(r.paths);
    }
  }
  const pathsFor = (r) => r.level === 2 ? r.paths
    : r.level === 1 ? [...new Set((p1[r.key] || []).flat())].sort()
    : [...new Set((p0[r.key] || []).flat())].sort();
  const byMax = (a,b) => Math.max(b.ssd,b.hdd) - Math.max(a.ssd,a.hdd);
  const out = [];
  const emit = (r, indent) => {
    const paths = pathsFor(r);
    const kids = r.level === 0 ? (openP.has(r.key) ? (kids1[r.key]||[]) : null)
               : r.level === 1 ? (openM.has(r.key) ? (kids2[r.key]||[]) : null) : null;
    const canExp = (r.level === 0 && (kids1[r.key]||[]).length > 0) ||
                   (r.level === 1 && (kids2[r.key]||[]).length > 0);
    out.push(
      '<tr><td>' + (indent ? '<span style="color:#556">' + ' '.repeat(indent*2) + '</span>' : '') +
      (canExp ? '<button class="btn" data-k="' + (r.level===0?'p':'m') + '" data-p="' + encodeURIComponent(r.key) + '" onclick="toggle(this)">\u229E</button>' : '') +
      '<span>' + esc(r.name) + (r.hasQ ? ' ' + Q : '') + '</span>' +
      '<button class="btn r" data-p="' + encodeURIComponent(paths.join('\n')) + '" onclick="copy(this)">\u29C9</button></td>' +
      '<td class="num">' + (r.ssd ? (r.ssd/GB).toFixed(1) : '\u2014') + '</td>' +
      '<td class="num">' + (r.hdd ? (r.hdd/GB).toFixed(1) : '\u2014') + '</td>' +
      '<td class="ic">' + icons(Math.max(r.ssd,r.hdd)/GB) +
      (r.mm ? ' <span class="warn" title="file size differs between ssd/hdd">' + WARN + '</span>' : '') +
      (r.dc ? ' <span class="disc" title="' + r.dc + ' file(s) present on one disk only">' + DISC + r.dc + '</span>' : '') +
      '</td></tr>'
    );
    if(kids){
      for(const c of [...kids].sort(byMax)) emit(c, indent + 1);
    }
  };
  const base = rows.filter(r => r.level === level).sort(byMax);
  for(const r of base) emit(r, 0);
  document.getElementById('tbl').innerHTML =
    '<table><thead><tr><th>path</th><th class="num">\u26A1 ssd GB</th><th class="num">\uD83D\uDC22 hdd GB</th><th>size (max)</th></tr></thead><tbody>' +
    out.join('') + '</tbody></table>';
  document.getElementById('loading').hidden = true;
}
fetch('/api/disks').then(r=>r.json()).then(dk=>{
  document.getElementById('disks').innerHTML = dk.disks.map(d=>{
    const pct = Math.round(d.used_gb/d.total_gb*100);
    return '<p>' + DISK[d.disk] + ' ' + d.mount + ': ' + d.used_gb + ' / ' + d.total_gb + ' GB (' + pct + '%)' +
      ' <span class="bar"><i style="width:' + pct + '%"></i></span></p>';
  }).join('');
}).catch(e=>{ const l=document.getElementById('loading'); l.innerHTML='<div style="color:#f55">disk info error: ' + esc(String(e)) + '</div>'; });
fetch('/api/sizes').then(r=>r.json()).then(sz=>{
  rows = sz.entries;
  build();
}).catch(e=>{ const l=document.getElementById('loading'); l.innerHTML='<div style="color:#f55">scan error: ' + esc(String(e)) + '</div>'; });
function freshTxt(w){
  if(w.prunable) return '<span class="none">prunable</span>';
  if(w.fresh === true)  return '<span class="fresh">fresh</span>';
  if(w.fresh === false) return '<span class="stale">stale' + ((w.ahead||w.behind)? ' (' + (w.ahead||0) + '/' + (w.behind||0) + ')' : '') + '</span>';
  return '<span class="none">no remote</span>';
}
function dirtyTxt(w){
  if(w.unstaged == null) return '';
  const parts = [];
  if(w.unstaged) parts.push('<span class="mt">' + w.unstaged + ' unstaged</span>');
  if(w.staged)   parts.push('<span class="mt">' + w.staged + ' staged</span>');
  return parts.join('');
}
fetch('/api/repos').then(r=>r.json()).then(d=>{
  const html = d.repos.map(rep=>{
    if(rep.error) return '<h3>' + esc(rep.name) + '</h3><p class="mt">' + esc(rep.error) + '</p>';
    const rows = rep.worktrees.map(w=>
      '<tr><td>' + esc(w.path.replace(/^\/home\/nixos\//,'')) + '</td>' +
      '<td>' + esc(w.branch||'(detached)') + ' <span class="none">' + esc(w.head) + '</span></td>' +
      '<td>' + freshTxt(w) + '</td>' +
      '<td>' + (w.unstaged==null?'':(w.unstaged+w.staged? dirtyTxt(w):'<span class="none">clean</span>')) + '</td></tr>'
    ).join('');
    return '<h3>' + esc(rep.name) + '</h3><table class="repotbl"><thead><tr><th>worktree</th><th>branch</th><th>vs remote</th><th>working tree</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }).join('');
  document.getElementById('repos').innerHTML = html;
}).catch(e=>{ document.getElementById('repos').innerHTML='<p class="mt">repos error: ' + esc(String(e)) + '</p>'; });
</script>
</body></html>
